# Vale checks the prose in Markdown files; code spans and code blocks are
# skipped, so names, commands and other non-prose take backticks rather than
# vocabulary entries. The vocabulary (.vale/styles/config/vocabularies/Base)
# holds English words Vale's dictionary lacks - nothing else: no filenames,
# variable names, commands, acronyms, product names, trademarks or people's
# names. Every entry also arms Vale.Terms, which then demands that exact
# capitalisation everywhere, so an entry that a backtick would cover is a
# net loss.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Base

[*.md]
BasedOnStyles = Vale
